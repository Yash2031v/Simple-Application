<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174f42">
  <title>Ledger | Expense manager</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173c34;
      --muted: #687a72;
      --line: #dce5dc;
      --paper: #f5f7f1;
      --surface: #fff;
      --green: #174f42;
      --green-dark: #103c33;
      --lime: #d9f078;
      --coral: #dc7259;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(90deg, transparent 49.9%, rgba(23, 60, 52, .025) 50%, transparent 50.1%),
        var(--paper);
      background-size: 72px 72px;
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }

    .topbar {
      min-height: 68px;
      background: var(--green);
      color: #fff;
    }

    .topbar-inner, main {
      width: min(1100px, calc(100% - 40px));
      margin-inline: auto;
    }

    .topbar-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 16px;
      font-weight: 700;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--lime);
      color: var(--green-dark);
      font-family: Georgia, serif;
      font-size: 19px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-left: 2px;
      color: #c0d2c7;
      font-size: 12px;
      font-weight: 400;
    }

    .currency-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d4e0d9;
      font-size: 12px;
    }

    .currency-control select {
      min-height: 34px;
      padding: 0 28px 0 10px;
      border: 1px solid #5d8074;
      border-radius: 5px;
      background: var(--green-dark);
      color: #fff;
    }

    main { padding-block: 34px 56px; }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 31px;
      font-weight: 500;
      line-height: 1.15;
    }

    .month-switcher {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .month-switcher button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
    }

    .month-switcher button:hover, .month-switcher button:focus-visible {
      border-color: var(--green);
    }

    .month-switcher strong {
      min-width: 130px;
      text-align: center;
      font-size: 13px;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(230px, 1.5fr) repeat(2, minmax(145px, 1fr));
      margin-bottom: 25px;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--green);
      color: #fff;
    }

    .overview-item {
      min-height: 105px;
      padding: 20px 23px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid rgba(255, 255, 255, .15);
    }

    .overview-item:first-child { border-left: 0; }
    .overview-label { color: #c7d8ce; font-size: 12px; }
    .overview-value { margin-top: 5px; font-size: 23px; font-weight: 650; }
    .overview-item:first-child .overview-value { color: var(--lime); font-size: 30px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(250px, .85fr);
      align-items: start;
      gap: 34px;
    }

    .entry-form {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr auto;
      align-items: end;
      gap: 10px;
    }

    .field { min-width: 0; }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .field input, .field select, .filter-control input, .filter-control select {
      width: 100%;
      min-height: 39px;
      padding: 0 10px;
      border: 1px solid #d5dfd6;
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
    }

    input:focus, select:focus, button:focus-visible {
      outline: 2px solid #648d43;
      outline-offset: 2px;
    }

    .add-button {
      min-height: 39px;
      padding: 0 14px;
      border: 0;
      border-radius: 5px;
      background: var(--green);
      color: #fff;
      font-weight: 650;
      white-space: nowrap;
    }

    .add-button:hover { background: var(--green-dark); }

    .notice {
      min-height: 20px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .notice[data-state="error"] { color: #a64332; }

    .transactions { margin-top: 27px; }

    .transaction-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .filter-control { display: flex; gap: 8px; }
    .filter-control input { width: min(190px, 32vw); }
    .filter-control select { width: 145px; }

    .transaction-list { border-top: 1px solid var(--line); }

    .transaction {
      min-height: 66px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--line);
    }

    .transaction-info { min-width: 0; }

    .transaction-title {
      overflow: hidden;
      margin: 0 0 3px;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transaction-meta { color: var(--muted); font-size: 11px; }
    .transaction-amount { font-size: 13px; font-weight: 700; white-space: nowrap; }

    .remove-button {
      padding: 7px 0 7px 6px;
      border: 0;
      background: transparent;
      color: #a15343;
      font-size: 11px;
    }

    .remove-button:hover { text-decoration: underline; }

    .empty-state {
      padding: 28px 8px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); }
    .insights { padding-top: 2px; }
    .insights h2 { margin-bottom: 5px; }
    .insight-subtitle { margin-bottom: 18px; color: var(--muted); font-size: 12px; }

    .category-row { margin-bottom: 17px; }

    .category-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 12px;
    }

    .category-name { display: flex; align-items: center; gap: 8px; }

    .category-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--dot-color);
    }

    .category-total { font-weight: 650; white-space: nowrap; }

    .category-track {
      height: 5px;
      overflow: hidden;
      border-radius: 10px;
      background: #e4eae2;
    }

    .category-fill {
      width: var(--share);
      height: 100%;
      border-radius: inherit;
      background: var(--dot-color);
    }

    .insights-empty { padding-block: 14px; color: var(--muted); font-size: 12px; }

    @media (max-width: 860px) {
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .add-button { width: 100%; }
    }

    @media (max-width: 700px) {
      .topbar-inner, main { width: min(100% - 30px, 540px); }
      main { padding-top: 25px; }
      .overview { grid-template-columns: 1fr 1fr; }
      .overview-item { min-height: 84px; padding: 14px 17px; }
      .overview-item:first-child { grid-column: 1 / -1; border-bottom: 1px solid rgba(255, 255, 255, .15); }
      .overview-item:nth-child(2) { border-left: 0; }
      .workspace { grid-template-columns: 1fr; gap: 29px; }
      .insights { padding-top: 0; }
    }

    @media (max-width: 440px) {
      .topbar-inner, main { width: calc(100% - 24px); }
      .brand-subtitle { display: none; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .month-switcher { align-self: flex-end; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      .field:first-child { grid-column: 1 / -1; }
      .transaction-toolbar { align-items: flex-start; flex-direction: column; }
      .filter-control { width: 100%; }
      .filter-control input { width: 100%; min-width: 0; }
      .filter-control select { width: 135px; flex: 0 0 135px; }
      .transaction { gap: 9px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">L</span><span>ledger <span class="brand-subtitle">/ expense manager</span></span></div>
      <label class="currency-control" for="currency-select">Currency
        <select id="currency-select" aria-label="Display currency">
          <option value="USD">USD $</option>
          <option value="EUR">EUR €</option>
          <option value="GBP">GBP £</option>
          <option value="CAD">CAD $</option>
          <option value="AUD">AUD $</option>
          <option value="INR">INR ₹</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <p class="eyebrow">Your money, in focus</p>
        <h1>Expenses</h1>
      </div>
      <div class="month-switcher" aria-label="Choose month">
        <button type="button" id="previous-month" aria-label="Previous month">‹</button>
        <strong id="month-label"></strong>
        <button type="button" id="next-month" aria-label="Next month">›</button>
      </div>
    </div>

    <section class="overview" aria-label="Monthly overview">
      <div class="overview-item"><span class="overview-label">Total spent</span><strong class="overview-value" id="total-spent">$0.00</strong></div>
      <div class="overview-item"><span class="overview-label">Transactions</span><strong class="overview-value" id="transaction-count">0</strong></div>
      <div class="overview-item"><span class="overview-label">Daily average</span><strong class="overview-value" id="daily-average">$0.00</strong></div>
    </section>

    <div class="workspace">
      <section aria-labelledby="add-heading">
        <form class="entry-form" id="expense-form">
          <div class="section-heading"><h2 id="add-heading">Add an expense</h2></div>
          <div class="form-grid">
            <div class="field">
              <label for="expense-title">Description</label>
              <input id="expense-title" name="title" type="text" maxlength="80" placeholder="e.g. Weekly groceries" required>
            </div>
            <div class="field">
              <label for="expense-category">Category</label>
              <select id="expense-category" name="category" required>
                <option value="food">Food &amp; drink</option>
                <option value="transport">Transport</option>
                <option value="home">Home</option>
                <option value="shopping">Shopping</option>
                <option value="health">Health</option>
                <option value="bills">Bills</option>
                <option value="leisure">Leisure</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="expense-amount">Amount</label>
              <input id="expense-amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required>
            </div>
            <div class="field">
              <label for="expense-date">Date</label>
              <input id="expense-date" name="date" type="date" required>
            </div>
            <button class="add-button" type="submit">Add expense</button>
          </div>
          <p class="notice" id="notice" role="status" aria-live="polite"></p>
        </form>

        <section class="transactions" aria-labelledby="transactions-heading">
          <div class="transaction-toolbar">
            <h2 id="transactions-heading">Transactions</h2>
            <div class="filter-control">
              <input id="search-input" type="search" placeholder="Search expenses" aria-label="Search expenses">
              <select id="category-filter" aria-label="Filter by category">
                <option value="all">All categories</option>
                <option value="food">Food &amp; drink</option>
                <option value="transport">Transport</option>
                <option value="home">Home</option>
                <option value="shopping">Shopping</option>
                <option value="health">Health</option>
                <option value="bills">Bills</option>
                <option value="leisure">Leisure</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="transaction-list" id="transaction-list" aria-live="polite"></div>
        </section>
      </section>

      <aside class="insights" aria-labelledby="category-heading">
        <h2 id="category-heading">Spending by category</h2>
        <p class="insight-subtitle" id="category-subtitle">This month</p>
        <div id="category-breakdown"></div>
      </aside>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "ledger-expenses-v1";
    const CURRENCY_KEY = "ledger-currency-v1";
    const categories = {
      food: { label: "Food & drink", color: "#e3845d" },
      transport: { label: "Transport", color: "#5686a0" },
      home: { label: "Home", color: "#9b8753" },
      shopping: { label: "Shopping", color: "#c66a72" },
      health: { label: "Health", color: "#668c68" },
      bills: { label: "Bills", color: "#8279a4" },
      leisure: { label: "Leisure", color: "#cf9b45" },
      other: { label: "Other", color: "#75877f" }
    };

    const form = document.querySelector("#expense-form");
    const titleInput = document.querySelector("#expense-title");
    const amountInput = document.querySelector("#expense-amount");
    const dateInput = document.querySelector("#expense-date");
    const categoryInput = document.querySelector("#expense-category");
    const currencySelect = document.querySelector("#currency-select");
    const notice = document.querySelector("#notice");
    const transactionList = document.querySelector("#transaction-list");
    const categoryBreakdown = document.querySelector("#category-breakdown");
    const searchInput = document.querySelector("#search-input");
    const categoryFilter = document.querySelector("#category-filter");
    let expenses = loadExpenses();
    let currency = loadCurrency();
    let selectedMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

    currencySelect.value = currency;
    dateInput.value = localDateString(new Date());

    function loadExpenses() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return [];
        return saved.filter((expense) =>
          expense && typeof expense.id === "string" &&
          typeof expense.title === "string" &&
          Object.hasOwn(categories, expense.category) &&
          Number.isFinite(expense.amount) && expense.amount > 0 &&
          typeof expense.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(expense.date)
        );
      } catch {
        return [];
      }
    }

    function loadCurrency() {
      try {
        const saved = localStorage.getItem(CURRENCY_KEY);
        return ["USD", "EUR", "GBP", "CAD", "AUD", "INR"].includes(saved) ? saved : "USD";
      } catch {
        return "USD";
      }
    }

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatMoney(amount) {
      return new Intl.NumberFormat(undefined, {
        style: "currency",
        currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(amount);
    }

    function monthKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthExpenses() {
      return expenses.filter((expense) => expense.date.startsWith(monthKey(selectedMonth)));
    }

    function setNotice(message, isError = false) {
      notice.textContent = message;
      notice.dataset.state = isError ? "error" : "default";
    }

    function persistExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        return true;
      } catch {
        setNotice("Browser storage is unavailable. This change will not persist after closing the page.", true);
        return false;
      }
    }

    function renderOverview(monthEntries) {
      const total = monthEntries.reduce((sum, expense) => sum + expense.amount, 0);
      const elapsedDays = selectedMonth.getFullYear() === new Date().getFullYear() &&
        selectedMonth.getMonth() === new Date().getMonth()
        ? new Date().getDate()
        : new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 0).getDate();

      document.querySelector("#month-label").textContent = new Intl.DateTimeFormat(undefined, {
        month: "long", year: "numeric"
      }).format(selectedMonth);
      document.querySelector("#total-spent").textContent = formatMoney(total);
      document.querySelector("#transaction-count").textContent = String(monthEntries.length);
      document.querySelector("#daily-average").textContent = formatMoney(total / elapsedDays);
      document.querySelector("#category-subtitle").textContent = new Intl.DateTimeFormat(undefined, {
        month: "long", year: "numeric"
      }).format(selectedMonth);
    }

    function renderTransactions(monthEntries) {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const filtered = monthEntries
        .filter((expense) => categoryFilter.value === "all" || expense.category === categoryFilter.value)
        .filter((expense) => expense.title.toLocaleLowerCase().includes(query))
        .sort((first, second) => second.date.localeCompare(first.date) || second.id.localeCompare(first.id));

      transactionList.replaceChildren();
      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        const heading = document.createElement("strong");
        heading.textContent = monthEntries.length ? "No matching expenses" : "Nothing logged this month";
        const detail = document.createElement("span");
        detail.textContent = monthEntries.length ? "Try another search or category." : "Add an expense above to start your ledger.";
        empty.append(heading, detail);
        transactionList.append(empty);
        return;
      }

      for (const expense of filtered) {
        const row = document.createElement("article");
        row.className = "transaction";
        const info = document.createElement("div");
        info.className = "transaction-info";
        const title = document.createElement("p");
        title.className = "transaction-title";
        title.textContent = expense.title;
        const meta = document.createElement("span");
        meta.className = "transaction-meta";
        meta.textContent = `${categories[expense.category].label} · ${new Intl.DateTimeFormat(undefined, {
          month: "short", day: "numeric", year: "numeric"
        }).format(new Date(`${expense.date}T12:00:00`))}`;
        info.append(title, meta);

        const amount = document.createElement("span");
        amount.className = "transaction-amount";
        amount.textContent = formatMoney(expense.amount);
        const removeButton = document.createElement("button");
        removeButton.className = "remove-button";
        removeButton.type = "button";
        removeButton.dataset.removeId = expense.id;
        removeButton.setAttribute("aria-label", `Remove ${expense.title}`);
        removeButton.textContent = "Remove";
        row.append(info, amount, removeButton);
        transactionList.append(row);
      }
    }

    function renderCategories(monthEntries) {
      categoryBreakdown.replaceChildren();
      const totals = new Map();
      for (const expense of monthEntries) {
        totals.set(expense.category, (totals.get(expense.category) || 0) + expense.amount);
      }
      const sorted = [...totals.entries()].sort((first, second) => second[1] - first[1]);
      const largest = sorted[0]?.[1] || 0;

      if (!sorted.length) {
        const empty = document.createElement("p");
        empty.className = "insights-empty";
        empty.textContent = "Category totals will appear here.";
        categoryBreakdown.append(empty);
        return;
      }

      for (const [key, total] of sorted) {
        const row = document.createElement("div");
        row.className = "category-row";
        row.style.setProperty("--dot-color", categories[key].color);
        const heading = document.createElement("div");
        heading.className = "category-heading";
        const name = document.createElement("span");
        name.className = "category-name";
        const dot = document.createElement("span");
        dot.className = "category-dot";
        dot.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.textContent = categories[key].label;
        name.append(dot, label);
        const amount = document.createElement("span");
        amount.className = "category-total";
        amount.textContent = formatMoney(total);
        heading.append(name, amount);
        const track = document.createElement("div");
        track.className = "category-track";
        track.setAttribute("aria-label", `${categories[key].label}: ${Math.round(total / largest * 100)}% of category spending`);
        const fill = document.createElement("div");
        fill.className = "category-fill";
        fill.style.setProperty("--share", `${total / largest * 100}%`);
        track.append(fill);
        row.append(heading, track);
        categoryBreakdown.append(row);
      }
    }

    function render() {
      const entries = monthExpenses();
      renderOverview(entries);
      renderTransactions(entries);
      renderCategories(entries);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const amount = Number(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        amountInput.setCustomValidity("Enter an amount greater than zero.");
        amountInput.reportValidity();
        return;
      }
      amountInput.setCustomValidity("");
      expenses.push({
        id: crypto.randomUUID(),
        title: titleInput.value.trim(),
        category: categoryInput.value,
        amount: Math.round(amount * 100) / 100,
        date: dateInput.value
      });
      const saved = persistExpenses();
      render();
      if (saved) setNotice("Expense saved in this browser.");
      form.reset();
      dateInput.value = localDateString(new Date());
      titleInput.focus();
    });

    amountInput.addEventListener("input", () => amountInput.setCustomValidity(""));
    transactionList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-id]");
      if (!button) return;
      expenses = expenses.filter((expense) => expense.id !== button.dataset.removeId);
      const saved = persistExpenses();
      render();
      if (saved) setNotice("Expense removed.");
    });

    document.querySelector("#previous-month").addEventListener("click", () => {
      selectedMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() - 1, 1);
      render();
    });
    document.querySelector("#next-month").addEventListener("click", () => {
      selectedMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 1);
      render();
    });
    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    currencySelect.addEventListener("change", () => {
      currency = currencySelect.value;
      try {
        localStorage.setItem(CURRENCY_KEY, currency);
        setNotice("Currency preference saved in this browser.");
      } catch {
        setNotice("Browser storage is unavailable. The currency preference will not persist.", true);
      }
      render();
    });

    render();
  </script>
</body>
</html>
